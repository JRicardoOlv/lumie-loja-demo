    <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu-principal">Menu</button>
  </header>

  <main id="conteudo">

  <section>
    <h1>Contato</h1>
    <p class="destaque">Dúvidas, sugestões ou parcerias? Escreva para nós.</p>

    <form id="form-contato" class="contato-form" action="#" method="post">

      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required>
      </div>

      <div class="campo">
        <label for="email-contato">E-mail</label>
        <input type="email" id="email-contato" name="email" autocomplete="email" required>
      </div>

      <div class="campo">
        <label for="assunto">Assunto</label>
        <select id="assunto" name="assunto" required>
          <option value="">Escolha um assunto</option>
          <option value="duvida">Dúvida sobre produtos</option>
          <option value="pedido">Meu pedido</option>
          <option value="sugestao">Sugestão</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="campo">
        <label for="mensagem-contato">Mensagem</label>
        <textarea id="mensagem-contato" name="mensagem" rows="6" required></textarea>
      </div>

      <div class="campo-check">
        <input type="checkbox" id="consentimento" name="consentimento" required>
        <label for="consentimento">Concordo em ser contatado(a) sobre esta mensagem.</label>
      </div>

      <button class="botao" type="submit">Enviar mensagem</button>
      <p id="contato-aviso" role="status"></p>

    </form>
  </section>

</main>
